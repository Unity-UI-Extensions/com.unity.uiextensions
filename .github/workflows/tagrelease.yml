name: Tag Release

on:
  workflow_call:
    inputs:
      build-host:
        required: true
        type: string    
      version:
        required: true
        type: string

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  packageRelease:
    name: Package UPM Project and tag
    runs-on: ${{ inputs.build-host }}
    steps:
      - name: Script Version
        run: |
          echo "::group::Script Versioning"
          $scriptVersion = "1.0.2"
          echo "Build Script Version: $scriptVersion"
          echo "::endgroup::"
        shell: pwsh   
      - name: Validate GIT_PAT
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GIT_PAT)) {
            Write-Error "GIT_PAT secret is empty or not set. Add a valid Personal Access Token to the repository/org secrets and re-run."
            exit 1
          }
          $headers = @{
            Authorization = "Bearer $env:GIT_PAT"
            "User-Agent"  = "uiextensions-release-preflight"
            Accept        = "application/vnd.github+json"
          }
          try {
            $repo = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY" -Headers $headers -ErrorAction Stop
          }
          catch {
            $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { "unknown" }
            Write-Error "GIT_PAT was rejected by GitHub (HTTP $code). It is likely expired, revoked, or lacks access to $env:GITHUB_REPOSITORY. Regenerate the token and update the GIT_PAT secret. Details: $($_.Exception.Message)"
            exit 1
          }
          if ($null -ne $repo.permissions -and -not $repo.permissions.push) {
            Write-Error "GIT_PAT authenticated but does not have push access to $env:GITHUB_REPOSITORY. Grant 'repo' (classic PAT) or Contents: read & write (fine-grained PAT)."
            exit 1
          }
          Write-Host "GIT_PAT validated: authenticated with push access to $env:GITHUB_REPOSITORY."
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          clean: true
          token: ${{ secrets.GIT_PAT }}
      - uses: actions/setup-node@v6
      - name: Set Github vars
        run: |
          if([string]::IsNullOrEmpty('${{ secrets.GIT_USER_NAME }}')){
            if([string]::IsNullOrEmpty('${{ secrets.GIT_USER_NAME }}')){
              $gitUser = "action"
              $gitEmail = "action@github.com"
            }
            else {
              $gitUser = "${GITHUB_ACTOR}"
              $gitEmail = "$gitUser@users.noreply.github.com"
            }
          }
          else {
            $gitUser = "${{ secrets.GIT_USER_NAME }}"
            $gitEmail = "$gitUser@users.noreply.github.com"
          }
          git config --global user.email "$gitUser@users.noreply.github.com"
          git config --global user.name "$gitUser"
        shell: pwsh     
      - name: Check if Tag Exists
        run: |
          $tagVersion = "${{ inputs.version }}"
          $tags = git tag
          echo "Tags found are [$tags], searching for [$tagVersion]"
          foreach ($tag in $tags)
          {
              if($tag.Trim() -eq "$tagVersion")
              {
                Write-Error "$tagVersion tag already exists"
                exit 1
              }
          }
        shell: pwsh
      - name: Create tag and push
        run: |
          $tagVersion = "${{ inputs.version }}"
          git tag -fa "v$tagVersion" "${GITHUB_SHA}" -m "v$tagVersion Release [skip ci]"
          git push origin "v$tagVersion" --force       
        shell: pwsh